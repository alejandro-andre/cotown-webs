<section class="servicios {{ site }}">

  <div class="text-container">
    <h2 class="fs-xx-large title">{{ literal('home-servicios-titulo', L) }}</h2>
    <p class="subtitle">{{ literal('home-servicios-texto', L) }}</p>
  </div>

  <div class="servicios-container">
    <div class="services-cards">

      {% for s in services %}
      <div class="card">
        {{ svg('services/' + s.icon) }}
        <h3 class="bold">{{ s | translate('Name', L) }}</h3>
        <p class="text">{{ s | translate('Description', L) }}</p>
      </div>
      {% endfor %}

    </div>
  </div>

</section>
