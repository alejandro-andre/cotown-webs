<!-- Google Tag Manager -->
<script>
(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':new Date().getTime(),event:'gtm.js'});
var f=d.getElementsByTagName(s)[0],j=d.createElement(s);j.async=true;
j.src='https://www.googletagmanager.com/gtm.js?id='+i;f.parentNode.insertBefore(j,f);
})(window,document,'script','dataLayer','{{ gtm }}');
</script>

<!-- Basic Page Needs
–––––––––––––––––––––––––––––––––––––––––––––––––– -->
<title>{{ title | replace("{city}", city) }}</title>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
<meta name="description" content="{{ description | replace('{city}', city) }}"/>
<meta name="author" content="{{ globals.author }}">
<meta name="robots" content="follow, index, max-snippet:-1, max-video-preview:-1, max-image-preview:large"/>
<!-- Custom meta -->
{{ literal('meta', L) }}

<!-- Mobile Specific Metas
–––––––––––––––––––––––––––––––––––––––––––––––––– -->
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Links and lang
–––––––––––––––––––––––––––––––––––––––––––––––––– -->
<link rel="canonical" href="{{ globals.url }}{{ url }}"/>
<link rel="shortlink" href="{{ globals.url }}{{ url }}"/>
<link rel="alternate" hreflang="x-default" href="{{ globals.url }}{{ alt.en }}" />
<link rel="alternate" hreflang="es" href="{{ globals.url }}{{ alt.es }}" />
<link rel="alternate" hreflang="en" href="{{ globals.url }}{{ alt.en }}" />

<!-- Twitter
–––––––––––––––––––––––––––––––––––––––––––––––––– -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{ title }}" />
<meta name="twitter:description" content="{{ description | replace('{city}', city) }}" />

<!-- Facebook
–––––––––––––––––––––––––––––––––––––––––––––––––– -->
<meta property="og:url" content="{{ globals.url }}{{ root }}{{ langs[L].folder }}"/>
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Cotown" />
<meta property="og:title" content="{{ title }}" />
<meta property="og:description" content="{{ description | replace('{city}', city) }}" />
<meta property="og:locale" content="{{ langs[L].locale }}" />
<meta property="og:image" content="{{ globals.image }}"/>

<!-- Fonts
–––––––––––––––––––––––––––––––––––––––––––––––––– -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="{{ cfg.fonts }}">

<!-- CSS: común (layout) + tema de marca -->
<!-- –––––––––––––––––––––––––––––––––––––––––––––––––– -->
<link rel="stylesheet" href="{{ root }}/assets/css/common.css">
<link rel="stylesheet" href="{{ root }}/assets/css/{{ cfg.theme }}.css">

<!-- Icons
–––––––––––––––––––––––––––––––––––––––––––––––––– -->
<link rel="stylesheet" href="{{ root }}/assets/icons/style.css">

<!-- Favicon
–––––––––––––––––––––––––––––––––––––––––––––––––– -->
<link rel="icon" type="image/png" href="{{ root }}/assets/img/favicon.png">
<link rel="shortcut icon" type="image/x-icon" href="{{ root }}/assets/img/favicon.png"/>
