<section class="partners cotown">
  <div class="text-container">
    <h2 class="head2 title">
      {{ literal('home-partners-titulo', L) }}
    </h2>
  </div>

  <div class="splide-partners splide" role="group">
    <div class="splide__track">
      <ul class="splide__list">
        {% for p in partners %}
        <li class="img splide__slide">
          {{ image(p.image, alt=p.Name, width=600, height=375) }}
        </li>
        {% endfor %}
      </ul>
    </div>
  </div>

</section>
